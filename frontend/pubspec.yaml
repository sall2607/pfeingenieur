name: sfm_equipment_app
description: Application mobile SFM Technologies - Détection d'équipements par IA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0

  # Caméra et vidéo
  camera: ^0.11.0
  video_player: ^2.8.0
  image_picker: ^1.1.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.3

  # Utilitaires
  intl: ^0.19.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/